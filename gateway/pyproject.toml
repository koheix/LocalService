[project]
name = "llm-console-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "openai>=1.54",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.db の engine はプロセス起動時に1つだけ作られるため、テストごとに
# イベントループが切り替わると asyncpg の接続が別ループに紐付いてしまう。
# セッション全体で1つのループを共有する。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# 同時実行系のテストがデッドロックした場合に、CIを無限に固まらせず
# 確実に赤にするためのグローバルセーフティネット。
timeout = 30
