<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>llm-console playground</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section id="login-view" class="view">
  <form id="login-form" class="login-box">
    <h1>llm-console</h1>
    <p class="hint">社内LLMプレイグラウンド</p>
    <label>メールアドレス
      <input type="email" id="login-email" required autocomplete="username" />
    </label>
    <label>パスワード
      <input type="password" id="login-password" required autocomplete="current-password" />
    </label>
    <button type="submit">ログイン</button>
    <p id="login-error" class="error" hidden></p>
  </form>
</section>

<section id="app-view" class="view" hidden>
  <aside class="sidebar">
    <div class="sidebar-header">
      <strong id="whoami"></strong>
      <button id="logout-btn" class="link-btn">ログアウト</button>
    </div>
    <button id="new-conversation-btn" class="primary-btn">＋ 新しい会話</button>
    <ul id="conversation-list" class="conversation-list"></ul>
  </aside>

  <main class="chat-area">
    <div id="empty-state" class="empty-state">
      左の「＋ 新しい会話」から始めてください。
    </div>

    <div id="conversation-panel" class="conversation-panel" hidden>
      <details class="settings" open>
        <summary>会話設定</summary>
        <div class="settings-grid">
          <label>タイトル
            <input type="text" id="setting-title" />
          </label>
          <label>モデル
            <select id="setting-model"></select>
          </label>
          <label>system prompt
            <textarea id="setting-system-prompt" rows="3"></textarea>
          </label>
          <label>temperature
            <input type="number" id="setting-temperature" step="0.1" min="0" max="2" />
          </label>
          <label>top_p
            <input type="number" id="setting-top-p" step="0.05" min="0" max="1" />
          </label>
          <label>max_tokens（空欄=既定）
            <input type="number" id="setting-max-tokens" min="1" />
          </label>
          <button id="save-settings-btn" type="button">設定を保存</button>
          <span id="settings-saved" class="hint" hidden>保存しました</span>
        </div>
      </details>

      <div id="messages" class="messages"></div>

      <form id="send-form" class="send-form">
        <textarea id="send-input" rows="2" placeholder="メッセージを入力（Shift+Enterで改行、Enterで送信）" required></textarea>
        <button type="submit">送信</button>
      </form>
    </div>
  </main>
</section>

<script src="app.js"></script>
</body>
</html>
